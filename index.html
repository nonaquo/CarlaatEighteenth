<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>carla at eighteenth</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Mr+Dafoe&family=Great+Vibes&display=swap">
<style>
:root{
  --sky:#1a1fa8; --deep:#0a0a5c; --night:#04041f; --water:#0b2fd6; --glow:#cfe0ff; --text:#dbe4ff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky:#1a1fa8;--deep:#0a0a5c;--night:#04041f;--water:#0b2fd6;--glow:#cfe0ff;--text:#dbe4ff;}}
:root[data-theme="dark"]{--sky:#1a1fa8;--deep:#0a0a5c;--night:#04041f;--water:#0b2fd6;--glow:#cfe0ff;--text:#dbe4ff;}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden}
body{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;color:var(--text)}
.stage{position:relative;height:100%;width:100%;background:linear-gradient(#10138f 0%,#1a22b8 45%,#1a1fa8 52%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hills,.bridge{position:absolute;left:0;width:100%;display:block}
.hills{top:22%;height:30%}
.bridge{top:52%;height:15%}
.lamp{position:absolute;bottom:48%;width:clamp(34px,7vw,74px);height:auto;overflow:visible}
.l1{left:2%;height:min(40vh,380px)} .l2{left:12%;height:min(31vh,290px)}
.l3{right:12%;height:min(33vh,310px)} .l4{right:2%;height:min(41vh,390px)}
.copy{position:absolute;left:50%;top:27%;transform:translateX(-50%);width:min(88vw,520px);text-align:center}
.copy p{margin:0}
.small{font-size:clamp(17px,2.4vw,22px);letter-spacing:.04em;opacity:.85}
h1{font-weight:500;font-size:clamp(40px,8vw,76px);line-height:1.02;margin:.15em 0 .2em;color:#eef2ff;text-shadow:0 0 22px rgba(130,170,255,.8)}
.when{font-style:italic;font-size:clamp(18px,2.8vw,26px);line-height:1.45}

/* ---------- STAR OPENING ---------- */
.veil{position:fixed;inset:0;z-index:40;transition:opacity 1.2s ease;
  background:radial-gradient(ellipse at 28% 38%,rgba(95,55,130,.28),transparent 55%),radial-gradient(ellipse at 74% 66%,rgba(45,70,170,.26),transparent 55%),radial-gradient(ellipse at 55% 18%,rgba(70,40,110,.18),transparent 50%),#000}
.rays{position:fixed;z-index:45;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;pointer-events:none;opacity:0;transition:opacity 3s ease 1s;
  background:repeating-conic-gradient(from 0deg,rgba(190,212,255,.2) 0 3deg,transparent 3deg 11deg,rgba(150,185,255,.12) 11deg 13deg,transparent 13deg 23deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 14%,transparent 40%);mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 14%,transparent 40%);animation:spin 120s linear infinite}
.halo{position:fixed;z-index:46;left:50%;top:50%;width:var(--hw,600px);height:var(--hw,600px);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity 2s ease .6s;
  background:radial-gradient(circle,rgba(170,200,255,.75) 0,rgba(110,150,255,.4) 32%,rgba(70,110,255,0) 68%)}
.rays.on{opacity:1}.halo.on{opacity:1;animation:pulse 4.5s ease-in-out infinite}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
.flash{position:fixed;inset:0;z-index:54;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(235,242,255,.95),rgba(150,185,255,.35) 40%,transparent 70%)}
.flash.go{animation:flash 1.8s ease-out}
.card{position:fixed;z-index:55;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;filter:blur(12px);pointer-events:none;
  transition:opacity 1.6s ease,transform 2s cubic-bezier(.16,1,.3,1),filter 1.6s ease;box-shadow:0 0 70px rgba(150,190,255,.5),0 24px 60px rgba(2,4,40,.55)}
.card.show{opacity:1;transform:translate(-50%,-50%) scale(1);filter:none}
.card.out{opacity:0;transform:translate(-50%,-56%) scale(1.07);filter:blur(10px);transition:opacity 1.3s ease,transform 1.6s ease,filter 1.3s ease}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.card .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;
  font-size:clamp(18px,2.6vw,22px);font-style:italic;letter-spacing:.05em;color:#eaf1ff;background:linear-gradient(160deg,#16219a,#0a0f66);border:1px solid rgba(220,232,255,.5)}
.close{position:absolute;top:-20px;right:-20px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(210,225,255,.75);background:rgba(8,12,90,.62);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer;padding:0;opacity:0;pointer-events:none;box-shadow:0 0 18px rgba(150,190,255,.55);
  transition:opacity 1.2s ease,transform .5s ease,box-shadow .4s ease}
.close.on{opacity:1;pointer-events:auto}
.close:hover,.close:focus-visible{transform:rotate(90deg) scale(1.1);box-shadow:0 0 32px rgba(200,220,255,.95);outline:none}
.close::before,.close::after{content:"";position:absolute;left:11px;top:19px;width:18px;height:1.5px;background:#eef3ff;border-radius:1px;transform:rotate(45deg)}
.close::after{transform:rotate(-45deg)}
.card [hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.7}}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

/* ---------- RIVER PAPERS ---------- */
.rp{position:absolute;left:0;right:0;top:66.5%;bottom:0;overflow:hidden;z-index:30;pointer-events:none}
.pp{--w:clamp(64px,17vw,150px);position:absolute;top:var(--y);left:-16%;width:var(--w);transform:translateX(-50%);
  background:none;border:0;padding:0;cursor:pointer;pointer-events:auto;font:inherit;color:inherit;
  transition:left var(--dur,8s) cubic-bezier(.12,.6,.22,1) var(--dl,0s),opacity .9s ease,transform 1s ease;-webkit-tap-highlight-color:transparent}
.pp.in{left:calc(var(--x) * 1%)}
.pp-bob{display:block;animation:bob 4.5s ease-in-out var(--bd,0s) infinite}
.pp-hov{display:block;transform-origin:50% 40%;transition:transform .45s cubic-bezier(.16,1,.3,1),filter .45s}
.pp:hover .pp-hov,.pp:focus-visible .pp-hov{transform:scale(1.14);filter:brightness(1.12) drop-shadow(0 0 16px rgba(170,205,255,.8))}
.pp:focus-visible{outline:none}
/* only the top part of the paper is visible; the rest is "under" the water */
.pp-clip{position:relative;display:block;width:100%;height:calc(var(--w) * .54);overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 68%,transparent 100%);mask-image:linear-gradient(#000 68%,transparent 100%);}
.pp-env{display:block;width:100%;height:auto;filter:drop-shadow(0 0 10px rgba(170,205,255,.55))}
.pp-clip::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(40,90,255,0) 20%,rgba(14,45,214,.65));pointer-events:none}
.pp-clip img,.pp-ph{display:block;width:100%;height:calc(var(--w) * 1.333);object-fit:cover}
.pp-ph{background:linear-gradient(160deg,#efe3c6,#d6c395);color:#4a3a1c}
.pp-ripple{position:absolute;left:-14%;right:-14%;top:calc(var(--w) * .54 - 7px);height:14px;border-radius:50%;
  border:1px solid rgba(200,220,255,.55);box-shadow:0 0 12px rgba(150,190,255,.45);animation:rip 3.2s ease-out var(--bd,0s) infinite;pointer-events:none}
.pp-label{display:block;margin-top:4px;text-align:center;font-style:italic;font-size:clamp(15px,2.1vw,21px);letter-spacing:.05em;color:#eaf1ff;
  text-shadow:0 0 12px rgba(130,170,255,.95),0 1px 2px rgba(2,4,40,.8);opacity:.92;white-space:nowrap}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(5px) rotate(1.4deg)}}
@keyframes rip{0%{transform:scale(.85);opacity:.85}100%{transform:scale(1.25);opacity:0}}

/* viewer */
.pview{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(2,3,28,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .45s ease;cursor:zoom-out}
.pview.on{opacity:1;pointer-events:auto}
.pv-paper{width:min(86vw,520px);max-height:76vh;aspect-ratio:3/4;transform:scale(.7);transition:transform .6s cubic-bezier(.16,1,.3,1);
  box-shadow:0 0 70px rgba(150,190,255,.5),0 24px 60px rgba(2,4,40,.6);overflow:hidden}
.pview.on .pv-paper{transform:scale(1)}
.pv-paper img,.pv-paper .pp-ph{width:100%;height:100%;object-fit:contain;display:flex;align-items:center;justify-content:center;font-size:28px;font-style:italic}
.pv-title{font-style:italic;font-size:clamp(22px,4vw,34px);letter-spacing:.06em;color:#eef2ff;text-shadow:0 0 18px rgba(130,170,255,.9)}
@media (prefers-reduced-motion:reduce){.pp{transition:none}.pp-bob,.pp-ripple{animation:none}}

/* ---------- RIVER -> SKY ---------- */
.pp.sink{transition:opacity 1s ease,transform 1.3s ease;opacity:0;transform:translateX(-50%) translateY(26px);pointer-events:none}
.pp.lift{transition:opacity 1.6s ease .5s;opacity:0;pointer-events:none}
.pp.lift .pp-hov{transform:scale(1.2);filter:brightness(1.5) drop-shadow(0 0 28px rgba(190,220,255,1))}
.stage{transition:transform 3.4s cubic-bezier(.66,0,.2,1);will-change:transform}
body.tilt .stage{transform:translateY(100%)}
.sky{position:fixed;inset:0;z-index:80;visibility:hidden;pointer-events:none;overflow:hidden;transform:translateY(-100%);
  transition:transform 3.4s cubic-bezier(.66,0,.2,1);
  background:linear-gradient(#010108 0%,#04052c 34%,#0a0d7a 76%,#10138f 100%)}
.sky.live{visibility:visible;pointer-events:auto}
body.tilt .sky{transform:translateY(0)}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
#skfx{position:fixed;inset:0;z-index:85;pointer-events:none;display:none}
#skfx.live{display:block}
.sk-back{position:fixed;z-index:90;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(210,225,255,.75);background:rgba(8,12,90,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  cursor:pointer;padding:0;opacity:0;visibility:hidden;pointer-events:none;box-shadow:0 0 18px rgba(150,190,255,.55);
  transition:opacity 1s ease,transform .5s ease,box-shadow .4s ease}
.sk-back.on{opacity:1;visibility:visible;pointer-events:auto}
.sk-back:hover,.sk-back:focus-visible{transform:rotate(90deg) scale(1.1);box-shadow:0 0 32px rgba(200,220,255,.95);outline:none}
.sk-back::before,.sk-back::after{content:"";position:absolute;left:12px;top:20px;width:18px;height:1.5px;background:#eef3ff;border-radius:1px;transform:rotate(45deg)}
.sk-back::after{transform:rotate(-45deg)}
@media (prefers-reduced-motion:reduce){.stage,.sky{transition:none}}

/* ---------- STARS: RSVP / DRESS CODE / MAPS (bird reveals them) ---------- */
.pp-label{font-style:normal;text-transform:uppercase;letter-spacing:.2em;font-size:clamp(10px,1.7vw,13px)}
.tri{position:absolute;left:0;right:0;top:7%;height:28%;z-index:31;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
.tri.on{opacity:1}
.st{position:absolute;transform:translateX(-50%);background:none;border:0;padding:0;cursor:pointer;color:#eaf1ff;font:inherit;text-align:center;pointer-events:none;-webkit-tap-highlight-color:transparent}
.st.lit{pointer-events:auto}
.st-c{left:50%;top:55%;--s:clamp(46px,10vw,72px)}
.st-a{left:20%;top:2%;--s:clamp(34px,7.5vw,54px)}
.st-b{left:80%;top:2%;--s:clamp(34px,7.5vw,54px)}
.st .pp-clip{display:block;width:var(--s);height:var(--s);overflow:visible;-webkit-mask-image:none;mask-image:none;margin:0 auto}
.st .pp-clip::after{display:none}
.st svg{display:block;width:100%;height:100%;fill:#f4f8ff;filter:drop-shadow(0 0 5px rgba(190,215,255,.9)) drop-shadow(0 0 14px rgba(120,160,255,.6));opacity:0;transform:scale(.2);transition:opacity .8s ease,transform 1.1s cubic-bezier(.16,1,.3,1)}
.st.lit svg{opacity:1;transform:scale(1);animation:twk 3.6s ease-in-out 1.4s infinite}
.st.lit:hover svg,.st.lit:focus-visible svg{transform:scale(1.15)}.st:focus-visible{outline:none}
@keyframes twk{50%{opacity:.7}}
.st-l{display:block;margin-top:8px;padding-left:.3em;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(12px,3vw,15px);letter-spacing:.3em;text-transform:uppercase;white-space:nowrap;
  text-shadow:0 0 10px rgba(130,170,255,.9);opacity:0;transform:translateY(6px);transition:opacity 1s ease .5s,transform 1s ease .5s}
.st.lit .st-l{opacity:.95;transform:none}
.st-beam{position:absolute;left:50%;top:calc(var(--s) / 2);width:2px;height:min(34vh,260px);pointer-events:none;opacity:0;transform:translate(-50%,-50%) scaleY(0);
  background:linear-gradient(transparent,rgba(225,238,255,.95),transparent)}
.st-beam::after{content:"";position:absolute;inset:0;background:inherit;transform:rotate(90deg)}
.st.lit .st-beam{animation:beam 1.8s ease-out}
@keyframes beam{0%{opacity:0;transform:translate(-50%,-50%) scaleY(0)}22%{opacity:1;transform:translate(-50%,-50%) scaleY(1)}100%{opacity:0;transform:translate(-50%,-50%) scaleY(1.35)}}
.bird{position:absolute;left:0;top:0;width:40px;height:26px;margin:-13px 0 0 -20px;opacity:0;pointer-events:none;z-index:3;overflow:visible;fill:none;stroke:#f4f8ff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(170,200,255,.9))}
.info{position:fixed;z-index:88;left:50%;top:26%;transform:translateX(-50%) translateY(12px);width:min(90vw,460px);max-height:66vh;overflow:auto;text-align:center;
  color:var(--text);font-size:clamp(18px,2.6vw,22px);line-height:1.5;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1.2s ease,transform 1.2s ease,visibility 0s 1.2s}
.info.on{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%);transition-delay:0s}
.info.dr{max-height:40vh}.info.dr .sw{flex-wrap:nowrap;gap:6px;margin:12px 0 0}.info.dr .sw div{width:62px}.info.dr .sw i{width:32px;height:32px;margin-bottom:4px}.info.dr .sw span{font-size:.62em}
#dance{position:fixed;inset:0;width:100%;height:100%;z-index:86;pointer-events:none;opacity:0;transition:opacity 1.4s ease}
#dance.on{opacity:1}.info p{margin:.4em 0}.info .sm{font-style:italic;opacity:.85}
.btn{display:inline-block;margin-top:14px;padding:.8em 2.2em;border-radius:999px;border:1px solid rgba(210,225,255,.8);background:rgba(10,16,110,.55);color:#fff;text-decoration:none;letter-spacing:.14em;text-transform:uppercase;font-size:.78em;box-shadow:0 0 22px rgba(150,190,255,.55)}
.btn.big{font-size:.95em;padding:1em 2.8em}
.sw{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:18px 0 4px}
.sw div{width:78px}.sw i{display:block;width:52px;height:52px;margin:0 auto 6px;border-radius:50%;border:1px solid rgba(255,255,255,.6);box-shadow:0 0 14px rgba(150,190,255,.4)}
.sw span{display:block;font-size:.72em;font-style:italic;line-height:1.2}
.map{width:100%;height:min(34vh,260px);border:1px solid rgba(210,225,255,.6);border-radius:10px;margin-top:12px;box-shadow:0 0 26px rgba(150,190,255,.4)}

  /* The credits image remains in the lower-left across every scene. */
  .credits-watermark{
    position:fixed;z-index:100;
    left:calc(12px + env(safe-area-inset-left,0px));
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
    display:block;width:clamp(90px,15vw,165px);max-height:64px;
    height:auto;object-fit:contain;object-position:left bottom;
    opacity:.78;pointer-events:none;user-select:none;
    filter:drop-shadow(0 2px 8px rgba(1,2,35,.4));
  }
  .credits-watermark[hidden]{display:none}
  @media(max-width:480px){.credits-watermark{width:clamp(82px,22vw,115px);max-height:48px}}

/* ---------- FIREWORKS: "See you on December 5th!" ---------- */
#fw,#fwa{position:absolute;inset:0;width:100%;height:100%;z-index:35;pointer-events:none}
.stage.fwOn .tri.on{opacity:.28}   /* the three stars hush while the sky writes the date */

/* ---------- SOUND (minimal) ---------- */
.snd-wrap{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:9999;display:flex;flex-direction:row-reverse;align-items:center;gap:10px;pointer-events:none}
.snd-hint{font:500 11px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.24em;text-transform:uppercase;color:#eaf3ff;white-space:nowrap;text-shadow:0 0 10px rgba(130,170,255,.9);
  opacity:0;transform:translateX(-6px);transition:opacity .8s ease,transform .8s ease}
.snd-wrap.hint .snd-hint{opacity:.95;transform:none}
.snd{position:relative;width:38px;height:38px;padding:0;border-radius:50%;cursor:pointer;color:#eef6ff;pointer-events:auto;-webkit-appearance:none;appearance:none;
  border:1px solid rgba(225,238,255,.5);background:rgba(8,16,90,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:background .4s ease,border-color .4s ease,transform .3s ease,box-shadow .4s ease}
.snd:hover,.snd:focus-visible{background:rgba(20,40,150,.45);border-color:rgba(240,248,255,.85);outline:none}
.snd:active{transform:scale(.93)}
.snd.on{border-color:rgba(240,248,255,.8);box-shadow:0 0 14px rgba(150,200,255,.45)}
.snd::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(210,230,255,.8);opacity:0;pointer-events:none}
.snd-wrap.hint .snd:not(.on)::after{animation:sndRing 2.4s ease-out infinite}
.snd svg{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s ease}
.snd .w{opacity:0}.snd.on .w{opacity:1}.snd .x{opacity:1}.snd.on .x{opacity:0}
@keyframes sndRing{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){.snd-wrap.hint .snd:not(.on)::after{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <canvas id="c" aria-hidden="true"></canvas>

  <svg class="hills" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 30 V16 C6 14 12 13.5 18 15 C26 17 34 24 44 26 C52 27 60 26 68 22 C78 16 86 10 100 7 V30Z" fill="#0b0c78"/>
  </svg>

  <svg class="bridge" viewBox="0 0 100 15" preserveAspectRatio="none" aria-hidden="true">
    <rect width="100" height="15" fill="#03031a"/>
    <path d="M2 11 C2 3 8 1.5 17 1.5 C27 1.5 34 3.5 34 11Z" fill="#0b0b6a"/>
    <path d="M63 11 C63 3.5 70 1.5 80 1.5 C90 1.5 97 3.5 97 11Z" fill="#0b0b6a"/>
    <rect x="38" y="11" width="22" height="4" fill="#03031a"/>
  </svg>

  <!-- lamps: same artwork reused four times -->
  <svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs><radialGradient id="halo"><stop offset="0" stop-color="#cfe0ff" stop-opacity=".95"/><stop offset=".3" stop-color="#7aa2ff" stop-opacity=".55"/><stop offset="1" stop-color="#4a74ff" stop-opacity="0"/></radialGradient>
    <g id="lamp">
      <circle cx="21" cy="40" r="62" fill="url(#halo)"/>
      <rect x="19" y="64" width="4" height="336" fill="#02020f"/>
      <rect x="15" y="52" width="12" height="14" rx="2" fill="#02020f"/>
      <path d="M21 4 V24 M12 22 C2 14 8 6 14 12 M30 22 C40 14 34 6 28 12 M8 30 C0 28 -2 22 4 20 M34 30 C42 28 44 22 38 20" stroke="#02020f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M9 26 H33 L29 54 H13Z" fill="#cfe2ff" stroke="#02020f" stroke-width="3"/>
      <path d="M15 30 H27 L25 50 H17Z" fill="#fff" opacity=".9"/>
    </g></defs></svg>
  <svg class="lamp l1" viewBox="-4 0 50 400" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><use href="#lamp"/></svg>
  <svg class="lamp l2" viewBox="-4 0 50 400" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><use href="#lamp"/></svg>
  <svg class="lamp l3" viewBox="-4 0 50 400" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><use href="#lamp"/></svg>
  <svg class="lamp l4" viewBox="-4 0 50 400" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><use href="#lamp"/></svg>

  <main class="copy">
    <p class="small"></p>
    <h1></h1>
    <p class="when"><br></p>
    <a class="rsvp" href="#rsvp"></a>
  </main>

  <!-- papers in the river -->
  <div class="rp" id="riverPapers"></div>
</div>

<div class="veil" id="veil"></div>
<div class="rays" id="rays"></div>
<div class="halo" id="halo"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="flash" id="flash"></div>
<div class="card" id="card"><img id="inviteImg" alt="You’re invited" hidden><div class="ph" id="invitePh">Your invitation image<br>goes here</div><button class="close" id="close" aria-label="Close invitation"></button></div>

<!-- paper viewer -->
<div class="pview" id="pview" aria-hidden="true"><div class="pv-paper" id="pvPaper"></div><div class="pv-title" id="pvTitle"></div></div>

<!-- sky scene (stars form the lists here) -->
<div class="sky" id="sky" aria-hidden="true"><canvas id="skyc"></canvas></div>
<canvas id="skfx" aria-hidden="true"></canvas>

<h2 class="sr">You’re invited!</h2>

<img class="credits-watermark" src="credits.png" alt="Design credits" onerror="this.hidden=true">

<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var lw=0,lh=0,W,H,dpr,stars=[],moon={},water=[],still=false,shoot=[],nextS=1.5,lastT=0;
  try{still=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  function rnd(a,b){return a+Math.random()*(b-a)}
  function setup(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=cv.clientWidth;H=cv.clientHeight;lw=W;lh=H;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    var wt=H*.665;
    var ns=Math.max(150,Math.min(340,Math.round(W*H*.5/2000)));
    stars=[];for(var i=0;i<ns;i++){var big=Math.random()<.08;
      stars.push({x:rnd(0,W),y:rnd(0,H*.5),r:big?rnd(1.3,2.1):rnd(.4,1.1),big:big,p:rnd(0,6.28),s:rnd(.5,1.8),c:Math.random()<.25?'#ffffff':(Math.random()<.5?'#cfe0ff':'#a9c4ff')})}
    moon={x:W/2,y:H*.15,r:Math.max(16,Math.min(W,H)*.045),dots:[]};
    for(i=0;i<260;i++){var a=rnd(0,6.28),d=Math.sqrt(Math.random())*moon.r;moon.dots.push({x:Math.cos(a)*d,y:Math.sin(a)*d,r:rnd(.4,1.1),p:rnd(0,6.28)})}
    water=[];var n=Math.min(9000,Math.round(W*(H-wt)/45));
    for(i=0;i<n;i++){var y=rnd(wt,H),k=(y-wt)/(H-wt);
      var hh=rnd(195,225),ll=rnd(68,100);water.push({rd:Math.random(),x:rnd(0,W),y:y,r:rnd(.35,1.0)+k*.7+(Math.random()<.04?rnd(.6,1.2):0),p:rnd(0,6.28),s:rnd(.8,3),dx:(1.5+k*7)*rnd(.7,1.3),c:'hsl('+hh+',100%,'+ll+'%)'})}
    cv.wt=wt;
  }
  function spawnShoot(){
    var dir=Math.random()<.5?1:-1,ang=rnd(.35,.6);
    shoot.push({x:rnd(W*.1,W*.9),y:rnd(H*.02,H*.26),vx:dir*Math.cos(ang),vy:Math.sin(ang),sp:rnd(520,820),len:rnd(90,180),life:rnd(.8,1.2),age:0});
  }
  function frame(ts){
    var t=ts/1000,dt=Math.min(.05,t-lastT);lastT=t;var wt=cv.wt;
    ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
    // stars
    stars.forEach(function(s){
      var a=.3+.6*Math.pow(Math.sin(t*s.s+s.p),2);
      ctx.globalAlpha=a;ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();
      if(s.big){ctx.globalAlpha=a*.7;ctx.fillRect(s.x-s.r*4,s.y-.4,s.r*8,.8);ctx.fillRect(s.x-.4,s.y-s.r*4,.8,s.r*8)}
    });
    // shooting stars
    if(!still){
      if(t>nextS){spawnShoot();if(Math.random()<.25)spawnShoot();nextS=t+rnd(2.5,6)}
      ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
      shoot=shoot.filter(function(s){
        s.age+=dt;if(s.age>s.life)return false;
        var f=s.age/s.life,fade=Math.sin(Math.PI*f),hx=s.x+s.vx*s.sp*s.age,hy=s.y+s.vy*s.sp*s.age;
        var tx=hx-s.vx*s.len,ty=hy-s.vy*s.len;
        var g2=ctx.createLinearGradient(hx,hy,tx,ty);
        g2.addColorStop(0,'rgba(255,255,255,'+fade+')');g2.addColorStop(.3,'rgba(170,200,255,'+fade*.55+')');g2.addColorStop(1,'rgba(120,160,255,0)');
        ctx.globalAlpha=1;ctx.strokeStyle=g2;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(tx,ty);ctx.stroke();
        var hg=ctx.createRadialGradient(hx,hy,0,hx,hy,9);hg.addColorStop(0,'rgba(255,255,255,'+fade+')');hg.addColorStop(1,'rgba(150,190,255,0)');
        ctx.fillStyle=hg;ctx.fillRect(hx-9,hy-9,18,18);
        return true;
      });
      ctx.globalCompositeOperation='source-over';
    }
    // moon glow + body
    ctx.globalAlpha=1;
    var g=ctx.createRadialGradient(moon.x,moon.y,moon.r*.6,moon.x,moon.y,moon.r*3.2);
    g.addColorStop(0,'rgba(110,150,255,.55)');g.addColorStop(1,'rgba(110,150,255,0)');
    ctx.fillStyle=g;ctx.fillRect(moon.x-moon.r*4,moon.y-moon.r*4,moon.r*8,moon.r*8);
    ctx.fillStyle='#2f5df0';ctx.beginPath();ctx.arc(moon.x,moon.y,moon.r,0,6.283);ctx.fill();
    moon.dots.forEach(function(d){ctx.globalAlpha=.4+.6*Math.pow(Math.sin(t*1.6+d.p),2);ctx.fillStyle='#b9d0ff';ctx.fillRect(moon.x+d.x,moon.y+d.y,d.r,d.r)});
    // water base
    ctx.globalAlpha=1;
    var wg=ctx.createLinearGradient(0,wt,0,H);
    wg.addColorStop(0,'#1c4ff0');wg.addColorStop(.55,'#1538d0');wg.addColorStop(1,'#0b1a86');
    ctx.fillStyle=wg;ctx.fillRect(0,wt,W,H-wt);
    // dark rim under bridge pier shadow
    var sg=ctx.createLinearGradient(0,wt,0,wt+14);sg.addColorStop(0,'rgba(2,2,25,.7)');sg.addColorStop(1,'rgba(2,2,25,0)');
    ctx.fillStyle=sg;ctx.fillRect(0,wt,W,14);
    // drifting shimmer bands
    ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round';
    for(var b=0;b<16;b++){
      var k2=(b+.5)/16,by=wt+(H-wt)*k2,amp=3+k2*9,fq=.02-k2*.012,sp=.5+k2*1.6;
      ctx.beginPath();
      for(var x2=-20;x2<=W+20;x2+=18){var y2=by+Math.sin(x2*fq-t*sp+b*2.1)*amp+Math.sin(x2*fq*2.3-t*sp*1.3+b)*amp*.4;if(x2===-20)ctx.moveTo(x2,y2);else ctx.lineTo(x2,y2)}
      ctx.strokeStyle='rgba(110,160,255,'+(.07+.05*Math.sin(b*1.9+t*.6))+')';
      ctx.lineWidth=6+k2*18;ctx.stroke();
    }
    // sparkles
    water.forEach(function(p){
      var a=Math.pow(Math.max(0,Math.sin(t*p.s+p.p)),3);
      var x=(p.x+t*p.dx*6)%W;p.by=p.by||p.y;p.y=p.by+Math.sin(t*.8+p.p)*1.6;
      var rs=window.__rsT0,vis=rs==null?0:Math.min(1,Math.max(0,(t-rs-p.rd*2.4)/.9));
      if(vis<=0)return;
      ctx.globalAlpha=(.25+.75*a)*vis;
      ctx.fillStyle=p.c;
      if(p.r<1.1){var s=p.r*2*(.8+.5*a);ctx.fillRect(x,p.y,s,s)}
      else{ctx.beginPath();ctx.arc(x,p.y,p.r*(.7+.6*a),0,6.283);ctx.fill()}
      if(a>.85&&p.r>1.3){ctx.globalAlpha=.5*vis;ctx.fillRect(x-p.r*3,p.y-.4,p.r*6,.8);ctx.fillRect(x-.4,p.y-p.r*3,.8,p.r*6)}
    });
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    if(!still)requestAnimationFrame(frame);
  }
  setup();
  window.addEventListener('resize',function(){if(cv.clientWidth===lw&&Math.abs(cv.clientHeight-lh)<lh*.22)return;setup();if(still)frame(0)});
  requestAnimationFrame(frame);
})();
</script>

<script>
(function(){
  var INVITE_SRC = 'carlainvi.jpg';   // <-- put your invitation image here, e.g. 'invite.jpg' or a data: URI

  var $=function(i){return document.getElementById(i)};
  var cv=$('fx'),ctx=cv.getContext('2d'),card=$('card'),img=$('inviteImg'),phd=$('invitePh'),veil=$('veil'),closeBtn=$('close');
  var reduce=false;try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  function rnd(a,b){return a+Math.random()*(b-a)}
  var lw=0,lh=0,dy=0,W,H,dpr,P=[],R=[],B=[],BG=[],phase='scatter',T0=0,box={},textPts=[],ir0=-1,bgFade=1,raf,dead=false,boomAt=-1,tb={x0:0,x1:0,cx:0,cy:0,fs:100};

  if(INVITE_SRC){img.onload=function(){if(P.length)relayoutBox()};img.src=INVITE_SRC;img.hidden=false;phd.hidden=true}

  /* sprites: crisp dot with a soft halo; 4-point sparkle; big blue flare */
  function sprite(cross,glow,arm){
    var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d');
    var r=g.createRadialGradient(32,32,0,32,32,32);
    r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(240,244,255,.95)');r.addColorStop(.55,'rgba('+glow+',.33)');r.addColorStop(1,'rgba('+glow+',0)');
    g.fillStyle=r;g.fillRect(0,0,64,64);
    if(cross){
      [[0,0,64,0,0,30.5,64,3],[0,0,0,64,30.5,0,3,64]].forEach(function(a){
        var l=g.createLinearGradient(a[0],a[1],a[2],a[3]);l.addColorStop(0,'rgba('+arm+',0)');l.addColorStop(.5,'rgba('+arm+',.95)');l.addColorStop(1,'rgba('+arm+',0)');
        g.fillStyle=l;g.fillRect(a[4],a[5],a[6],a[7])});
    }
    return c;
  }
  var S0=sprite(0,'170,195,255'),S1=sprite(1,'170,195,255','255,255,255'),S2=sprite(1,'110,160,255','190,215,255');

  /* sample the lettering into stipple dots (bigger dots toward the middle of each stroke) */
  function sampleText(){
    var oc=document.createElement('canvas');oc.width=W;oc.height=H;var g=oc.getContext('2d');
    var fam='"Mr Dafoe","Kaushan Script","Great Vibes",cursive',L=['You’re','Invited!'];
    var fs=100;g.font=fs+'px '+fam;
    var widest=Math.max(g.measureText(L[0]).width,g.measureText(L[1]).width);
    fs=Math.min(fs*Math.min(W*.66,780)/widest,H*.27);
    g.font=fs+'px '+fam;g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';g.strokeStyle='#fff';g.lineWidth=fs*.025;g.lineJoin='round';
    var lh=fs*.98,ww=g.measureText(L[1]).width;
    g.translate(W/2,H/2);g.rotate(-.07);
    g.fillText(L[0],-ww*.14,-lh*.5);g.strokeText(L[0],-ww*.14,-lh*.5);
    g.fillText(L[1],ww*.08,lh*.52);g.strokeText(L[1],ww*.08,lh*.52);
    var d=g.getImageData(0,0,W*(devicePixelRatio>1?1:1),H).data;
    var step=Math.max(3,Math.round(fs/30)),pts;
    function A(x,y){x=x|0;y=y|0;return(x<0||y<0||x>=W||y>=H)?0:d[(y*W+x)*4+3]>110?1:0}
    for(;;step++){pts=[];var o=step*2.4,dg=o*.7;
      for(var y=step/2;y<H;y+=step)for(var x=step/2;x<W;x+=step){
        if(!A(x,y))continue;
        var n=A(x+o,y)+A(x-o,y)+A(x,y+o)+A(x,y-o)+A(x+dg,y+dg)+A(x-dg,y-dg)+A(x+dg,y-dg)+A(x-dg,y+dg);
        pts.push([x+rnd(-.7,.7),y+rnd(-.7,.7),.55+.6*n/8])}
      if(pts.length<=4200)break}
    pts.step=step;pts.fs=fs;return pts;
  }
  function boxRect(){
    var ar=img.naturalWidth?img.naturalWidth/img.naturalHeight:3/4;
    var mh=H*.68,mw=Math.min(W*.8,440),w=Math.min(mw,mh*ar),h=w/ar;
    return{x:(W-w)/2,y:(H-h)/2,w:w,h:h};
  }
  function perim(r,s){
    var Lg=2*(r.w+r.h),d=s*Lg;
    if(d<r.w)return[r.x+d,r.y];d-=r.w;
    if(d<r.h)return[r.x+r.w,r.y+d];d-=r.h;
    if(d<r.w)return[r.x+r.w-d,r.y+r.h];d-=r.w;
    return[r.x,r.y+r.h-d];
  }
  function infl(r,k){return{x:r.x-k,y:r.y-k,w:r.w+2*k,h:r.h+2*k}}

  function assign(){
    var o=infl(box,16),i2=infl(box,8),st=textPts.step,x0=1e9,x1=-1e9,sy=0;
    textPts.forEach(function(q){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);sy+=q[1]});
    tb={x0:x0,x1:x1,cx:(x0+x1)/2,cy:sy/textPts.length,fs:textPts.fs};
    P.forEach(function(p,i){
      var q=textPts[i];p.sx=q[0];p.sy=q[1];p.r=st*.36*q[2];
      p.dl=(q[0]-x0)/Math.max(1,x1-x0)*1.5+rnd(0,.25);   /* the words write themselves left to right */
      p.u=Math.random();p.bd=p.u*.9+rnd(0,.2);p.rg=Math.random()<.6;var pp=perim(p.rg?o:i2,p.u);p.bx=pp[0];p.by=pp[1];
      p.flare=i%Math.max(1,Math.floor(P.length/13))===0;
    });
  }
  function target(p){return phase==='scatter'?null:phase==='text'?[p.sx,p.sy]:[p.bx,p.by]}

  function layout(keep){
    dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;lw=W;lh=H;dy=0;
    cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
    box=boxRect();card.style.width=box.w+'px';card.style.height=box.h+'px';
    $('halo').style.setProperty('--hw',Math.max(box.w,box.h)*2.3+'px');
    textPts=sampleText();var N=textPts.length;
    while(P.length>N)P.pop();
    while(P.length<N)P.push({x:rnd(0,W),y:rnd(0,H),fx:0,fy:0,k:rnd(.02,.055),dl:rnd(0,1.2),s:rnd(.8,2.8),ph:rnd(0,6.28),a:0,t0:0});
    assign();
    BG=[];for(var i=0;i<Math.round(W*H/4500);i++)BG.push({x:rnd(0,W),y:rnd(0,H),r:rnd(.6,1.9),s:rnd(.4,1.8),ph:rnd(0,6.28)});
    if(keep)P.forEach(function(p){var t=target(p);if(t){p.x=t[0];p.y=t[1]}});
  }

  function relayoutBox(){box=boxRect();card.style.width=box.w+'px';card.style.height=box.h+'px';$('halo').style.setProperty('--hw',Math.max(box.w,box.h)*2.3+'px');
    var o=infl(box,16),i2=infl(box,8);P.forEach(function(p){var pp=perim(p.rg?o:i2,p.u);p.bx=pp[0];p.by=pp[1]})}
  function go(ph){
    phase=ph;window.SFX&&SFX.cue('go:'+ph);var now=performance.now()/1000;
    P.forEach(function(p){p.fx=p.x;p.fy=p.y;p.t0=now+(ph==='box'?p.bd:p.dl)});
    if(ph==='box')setTimeout(reveal,reduce?0:3000);
  }
  function reveal(){
    if(dead||phase!=='box')return;
    phase='reveal';ir0=performance.now()/1000;window.SFX&&SFX.cue('reveal');
    $('flash').classList.add('go');card.classList.add('show');
    $('rays').classList.add('on');$('halo').classList.add('on');
    setTimeout(function(){if(phase==='reveal')closeBtn.classList.add('on')},reduce?0:1800);
  }
  function close(){
    if(phase!=='reveal')return;
    phase='dissolve';window.SFX&&SFX.cue('close');closeBtn.classList.remove('on');card.classList.add('out');
    veil.style.pointerEvents='none';      /* so the papers can be clicked while the veil fades */
    setTimeout(window.spawnPapers,2600);  /* papers start flowing in */
    $('rays').classList.remove('on');$('halo').classList.remove('on');veil.style.opacity=0;
    var now=performance.now()/1000,wt=H*.665;
    window.__rsT0=now+1.1;                                   /* the river's sparkles are born as the stars arrive */
    function river(o,fx,fy){o.fx=fx;o.fy=fy;o.tx=rnd(W*.03,W*.97);o.ty=wt+8+(H-wt-16)*Math.random();
      o.cx=(fx+o.tx)/2+rnd(-100,100);o.cy=Math.min(fy,o.ty)-rnd(60,180);o.t0=now+rnd(0,1.3);o.D=rnd(1.8,2.7);return o}
    P.forEach(function(p){river(p,p.x,p.y);p.dv=1});
    for(var i=0;i<220;i++)B.push(river({s:rnd(.8,2.6),ph:rnd(0,6.28)},box.x+rnd(0,box.w),box.y+rnd(0,box.h)));
    setTimeout(cleanup,6800);
  }
  function cleanup(){
    dead=true;cancelAnimationFrame(raf);
    ['veil','rays','halo','fx','flash','card'].forEach(function(i){var e=$(i);e&&e.remove()});
  }

  var last=0;
  function frame(ms){
    if(dead)return;
    var t=ms/1000,dt=Math.min(.05,t-last);last=t;
    ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
    var boxy=(phase==='box'||phase==='reveal'),tw=reduce?0:1;
    if(phase==='scatter'&&t-T0>.9)go('text');
    if(phase==='text'&&boomAt<0&&t-T0>4.6){boomAt=t;window.SFX&&SFX.cue('boom')}
    if(phase==='text'&&boomAt>=0&&t-boomAt>4.6)go('box');
    var ba=boomAt>=0?t-boomAt:-1;
    var shk=0;
    ctx.save();ctx.translate(shk,shk*.6+dy);

    /* iris: light floods outward from the invitation, revealing the river */
    if(ir0>=0&&veil.style.display!=='none'){
      var f=Math.min(1,(t-ir0)/(reduce?.01:3.4)),e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2,rr=e*Math.hypot(W,H)*.6,fe=Math.max(W,H)*.25;
      var m='radial-gradient(circle at 50% 50%,transparent '+rr+'px,#000 '+(rr+fe)+'px)';
      veil.style.webkitMaskImage=veil.style.maskImage=m;
      if(f>=1)veil.style.display='none';
    }
    if(phase==='reveal'||phase==='dissolve')bgFade=Math.max(0,bgFade-dt*.45);

    /* night sky */
    if(bgFade>0)BG.forEach(function(b){
      ctx.globalAlpha=bgFade*(.1+.5*Math.pow(Math.sin(t*b.s+b.ph),2));var s=b.r*2.4;ctx.drawImage(S0,b.x-s,b.y-s,s*2,s*2)});

    P.forEach(function(p){
      var tg=target(p),age=t-p.t0,ox=p.x,oy=p.y,lg=0;
      p.a=Math.min(1,p.a+dt*.8);
      if(phase==='dissolve'){
        var fd=Math.min(1,Math.max(0,(t-p.t0)/p.D)),ed=fd<.5?4*fd*fd*fd:1-Math.pow(-2*fd+2,3)/2,iu=1-ed,lf=t-p.t0-p.D;
        p.x=iu*iu*p.fx+2*iu*ed*p.cx+ed*ed*p.tx;p.y=iu*iu*p.fy+2*iu*ed*p.cy+ed*ed*p.ty;   /* arcs up, then pours down into the water */
        p.a=lf>0?Math.max(0,1-lf/1.1):1;if(lf>0&&lf<.9)lg=Math.exp(-lf*5)*1.1;
      }else if(!tg||age<0){p.x+=Math.sin(t*.4+p.ph)*.2*tw;p.y+=Math.cos(t*.35+p.ph*1.3)*.2*tw}
      else{
        var D=reduce?.01:(phase==='box'?1.5:1.8),f=Math.min(1,age/D),e2=1-Math.pow(1-f,3),arc=Math.sin(Math.PI*f)*.1;
        var ddx=tg[0]-p.fx,ddy=tg[1]-p.fy;                      /* clean eased glide with one gentle shared curve */
        p.x=p.fx+ddx*e2-ddy*arc;p.y=p.fy+ddy*e2+ddx*arc;
        if(f>=1&&!reduce){p.x+=Math.sin(t*1.4+p.ph)*.12;p.y+=Math.cos(t*1.2+p.ph)*.12}
      }
      var vx=p.x-ox,vy=p.y-oy,a=p.a*(.62+.38*Math.pow(Math.sin(t*p.s+p.ph),2));
      if(boxy){var w=Math.pow(Math.max(0,Math.sin(t*2.2-p.u*18.85)),6);a=Math.min(1,a*.8+w*.9)}
      var px=p.x,py=p.y,boost=0;
      if(ba>=0&&phase==='text'){
        var bm=ba-2.1,ex=px-tb.cx,ey=py-tb.cy,dd=Math.sqrt(ex*ex+ey*ey)||1;
        if(bm>=0){var pk=6*Math.exp(-bm*3)*Math.sin(bm*8);px+=ex/dd*pk;py+=ey/dd*pk}   /* soft swell */
        var bp=(ba-.1)/2.1;
        if(bp>-.2&&bp<1.5){                                           /* shine drifting over the letters */
